[pytest]
# ПРОСТОР 2.0 — конфигурация pytest (приоритетнее [tool.pytest.ini_options] в pyproject.toml)
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra --strict-markers
markers =
    unit: Детерминированные unit-тесты (без HTTP, внешние зависимости замоканы)
    integration: Интеграционные API-тесты (httpx ASGI-клиент + тестовая БД)
