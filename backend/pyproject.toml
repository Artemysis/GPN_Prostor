[project]
name = "gpn-prostor-backend"
version = "0.1.0"
description = "Backend сервис GPN Prostor: конструктор ТЗ и ИИ-агент умного поиска"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "pgvector>=0.5.0",
    "openai>=3.1.0",
    "docxtpl>=0.20.2",
    "python-docx>=1.2.0",
    "weasyprint>=69.0",
    "pandas>=3.0.5",
    "openpyxl>=3.1.5",
    "boto3>=1.43.72",
    "minio>=7.2.20",
    "loguru>=0.7.2",
    "python-multipart>=0.0.20",
    "pyjwt>=2.10.1",
    "sentence-transformers>=3.3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "deepeval>=4.1.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI-идиома Depends()/Query()/File() в значениях по умолчанию

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
